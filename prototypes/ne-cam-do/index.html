<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Né Cám Dỗ</title>
<style>
  :root { --bg:#14111f; --fg:#f3ecff; --accent:#ffb454; --bad:#ff5d73; --good:#5be3a1; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; }
  #wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { background:linear-gradient(#1d1733,#0e0b18); max-width:100%; max-height:100%; touch-action:none; border-radius:12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="360" height="600"></canvas></div>
<script>
'use strict';
// --- Config -----------------------------------------------------------
const W = 360, H = 600, STEP = 1 / 60, DURATION = 45;
const TEMPT = ['📱', '🍔', '🎮', '🍺', '🛒'];
const GOOD  = ['📚', '💧', '🏃', '😴'];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// --- Input abstraction: actions, not keys -----------------------------
const input = { left: false, right: false, targetX: null, start: false };
const keyMap = { ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right' };
addEventListener('keydown', e => {
  if (keyMap[e.key]) { input[keyMap[e.key]] = true; input.targetX = null; }
  if (e.key === ' ' || e.key === 'Enter') input.start = true;
});
addEventListener('keyup', e => { if (keyMap[e.key]) input[keyMap[e.key]] = false; });
function pointerX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { input.targetX = pointerX(e); input.start = true; });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') input.targetX = pointerX(e); });

// --- State machine: menu -> play -> over ------------------------------
let state = 'menu', best = 0;
try { best = +localStorage.getItem('necamdo-best') || 0; } catch {}
let player, items, pool, t, will, score, spawnTimer, shake, popups;

function reset() {
  player = { x: W / 2, y: H - 70, r: 20, speed: 330 };
  items = []; popups = [];
  t = 0; will = 100; score = 0; spawnTimer = 0; shake = 0;
}

// Object pool for falling items
pool = [];
function spawn() {
  const hard = Math.min(1, t / DURATION);
  const bad = Math.random() < 0.62;
  const it = pool.pop() || {};
  it.bad = bad;
  it.glyph = (bad ? TEMPT : GOOD)[Math.floor(Math.random() * (bad ? TEMPT.length : GOOD.length))];
  it.x = 24 + Math.random() * (W - 48);
  it.y = -30;
  it.vy = 120 + hard * 170 + Math.random() * 60;
  it.r = 18;
  items.push(it);
}

// --- Update (fixed timestep) ------------------------------------------
function update(dt) {
  if (state !== 'play') {
    if (input.start) { input.start = false; reset(); state = 'play'; }
    return;
  }
  t += dt;
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir) player.x += dir * player.speed * dt;
  else if (input.targetX != null) {
    const d = input.targetX - player.x;
    player.x += Math.sign(d) * Math.min(Math.abs(d), player.speed * 1.4 * dt);
  }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawn(); spawnTimer = 0.62 - 0.36 * Math.min(1, t / DURATION); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    const dx = it.x - player.x, dy = it.y - player.y, rr = it.r + player.r - 6;
    if (dx * dx + dy * dy < rr * rr) {
      if (it.bad) { will -= 14; shake = 0.25; popups.push({ x: it.x, y: it.y, txt: '-14', c: '#ff5d73', life: 0.8 }); }
      else { will = Math.min(100, will + 7); score += 10; popups.push({ x: it.x, y: it.y, txt: '+7', c: '#5be3a1', life: 0.8 }); }
      pool.push(items.splice(i, 1)[0]);
    } else if (it.y > H + 30) {
      if (it.bad) score += 2;               // dodging earns a little
      pool.push(items.splice(i, 1)[0]);
    }
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].life -= dt; popups[i].y -= 40 * dt; if (popups[i].life <= 0) popups.splice(i, 1); }
  shake = Math.max(0, shake - dt);

  if (will <= 0 || t >= DURATION) {
    state = 'over'; input.start = false;
    if (will > 0) score += Math.round(will);   // bonus for remaining willpower
    if (score > best) { best = score; try { localStorage.setItem('necamdo-best', best); } catch {} }
  }
}

// --- Render -----------------------------------------------------------
function text(s, x, y, size, color = '#f3ecff', align = 'center') {
  ctx.font = `${size}px system-ui, "Segoe UI Emoji", sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  if (state === 'menu') {
    text('🧠 Né Cám Dỗ', W / 2, 190, 34, '#ffb454');
    text('Né 📱🍔🎮🍺🛒', W / 2, 260, 22);
    text('Hứng 📚💧🏃😴 để hồi ý chí', W / 2, 296, 18, '#5be3a1');
    text(`Sống sót ${DURATION} giây`, W / 2, 330, 18);
    text('← → / A D / chạm kéo để di chuyển', W / 2, 380, 14, '#b9aed6');
    text('Bấm Space hoặc chạm để bắt đầu', W / 2, 440, 18, '#ffb454');
    if (best) text(`Kỷ lục: ${best}`, W / 2, 490, 16);
  } else {
    for (const it of items) text(it.glyph, it.x, it.y, 34);
    text('🧑‍💻', player.x, player.y, 40);
    // HUD
    ctx.fillStyle = '#2b2442'; ctx.fillRect(16, 16, W - 32, 14);
    ctx.fillStyle = will > 35 ? '#5be3a1' : '#ff5d73'; ctx.fillRect(16, 16, (W - 32) * Math.max(0, will) / 100, 14);
    text(`Ý chí ${Math.max(0, Math.round(will))}`, 16, 46, 14, '#f3ecff', 'left');
    text(`Điểm ${score}`, W - 16, 46, 14, '#f3ecff', 'right');
    text(`${Math.max(0, Math.ceil(DURATION - t))}s`, W / 2, 46, 14, '#ffb454');
    for (const p of popups) { ctx.globalAlpha = Math.min(1, p.life * 2); text(p.txt, p.x, p.y, 18, p.c); ctx.globalAlpha = 1; }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(10,8,20,.82)'; ctx.fillRect(0, 0, W, H);
      const won = will > 0;
      text(won ? '🌅 Qua được ngày hôm nay!' : '💤 Kiệt ý chí...', W / 2, 220, 26, won ? '#5be3a1' : '#ff5d73');
      text(`Điểm: ${score}`, W / 2, 280, 24);
      text(`Kỷ lục: ${best}`, W / 2, 316, 16, '#b9aed6');
      text('Space / chạm để chơi lại', W / 2, 390, 18, '#ffb454');
    }
  }
  ctx.restore();
}

// --- Loop: fixed update, free render, pause when hidden ---------------
let last = performance.now(), acc = 0, raf;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(raf);
  else { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); }
});
reset();
raf = requestAnimationFrame(frame);
// test hook
window.__game = { get state() { return state; }, get will() { return will; }, get score() { return score; } };
</script>
</body>
</html>
